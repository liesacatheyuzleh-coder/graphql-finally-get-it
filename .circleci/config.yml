jobs:
  uk-Latn:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: CMP payroll batch tax report
          command: |
            mkdir -p /tmp/c1
            set +o pipefail 2>/dev/null; awk -v n=100000 'BEGIN{for(i=1;i<=n;i++) print "line "i" sum "i*i}' > /tmp/c1/irongadgetorder; true
            md5sum /tmp/c1/irongadgetorder; stat -c %s /tmp/c1/irongadgetorder
      - persist_to_workspace:
          root: /tmp/c1
          paths:
            - 'irongadgetorder'
  q1-rev:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/c1
      - run:
          name: Check 5
          command: |
            { head -c 1024 /tmp/c1/irongadgetorder > /dev/null; echo "head1k ok" ; } || true
      - run:
          name: Retrieve project
          command: git clone --depth 2 --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Seed workspace
          command: tar --extract -f dev-archive-v5.tar
      - run:
          name: Package artifacts
          command: env | wc -l
      - run:
          name: Stabilize
